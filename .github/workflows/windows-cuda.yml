name: Windows CUDA tests

on:
  push:
    branches: [main]
    paths: ["onyx_cuda/**", ".github/workflows/windows-cuda.yml"]
  pull_request:
    paths: ["onyx_cuda/**", ".github/workflows/windows-cuda.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: onyx_cuda
    env:
      RUSTUP_TOOLCHAIN: "1.96.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          architecture: x64
      - name: Build and install package
        run: |
          rustup toolchain install 1.96.1 --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -c requirements-validation.txt torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -c requirements-validation.txt ".[dev]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
      - name: Test native engine
        run: cargo test --locked --manifest-path rust/Cargo.toml
      - name: Test Python package
        run: python -m pytest tests -m "not gpu" --strict-markers -q --junitxml=validation/pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results
          path: onyx_cuda/validation/pytest.xml
