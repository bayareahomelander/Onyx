[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "onyx-cuda"
version = "0.1.0"
description = "Windows and NVIDIA CUDA implementation of Onyx"
requires-python = ">=3.10"
dependencies = [
    "torch==2.6.0",
    "transformers==4.57.6",
]

[project.optional-dependencies]
server = [
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "uvicorn==0.52.4",
    "httpx==0.28.1",
]
dev = [
    "maturin==1.14.1",
    "pytest==9.1.1",
    "onyx-cuda[server]",
]

[tool.maturin]
features = ["extension-module"]
python-source = "src"
module-name = "onyx_cuda._rust"
manifest-path = "rust/Cargo.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
