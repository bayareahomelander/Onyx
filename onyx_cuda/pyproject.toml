[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "onyx-cuda"
version = "0.1.0"
description = "Windows and NVIDIA CUDA implementation of Onyx"
requires-python = ">=3.10"
dependencies = [
    "torch==2.6.0",
    "transformers==4.57.6",
]

[project.optional-dependencies]
dev = [
    "maturin==1.14.1",
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
