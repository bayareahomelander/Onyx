[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "onyx-cuda"
version = "0.1.0"
description = "NVIDIA CUDA implementation of Onyx for Windows and Linux"
readme = "README.md"
license = "MIT"
authors = [{ name = "Weichen Sun" }]
requires-python = ">=3.12"
dependencies = [
    "torch==2.6.0",
    "transformers==4.57.6",
    "accelerate==1.12.0",
]

[project.urls]
Repository = "https://github.com/bayareahomelander/Onyx"

[project.optional-dependencies]
server = [
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "uvicorn==0.52.4",
    "httpx==0.28.1",
]
dev = [
    "maturin==1.14.1",
    "pytest==9.1.1",
    "jsonschema>=4.23,<5",
    "onyx-cuda[server]",
]

[tool.maturin]
features = ["extension-module"]
python-source = "src"
module-name = "onyx_cuda._rust"
manifest-path = "rust/Cargo.toml"
locked = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires an NVIDIA CUDA device (real models or CUDA tensors)"]
